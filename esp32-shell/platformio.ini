; PlatformIO Project Configuration File
;
; ESP32 Shell Port - PlatformIO Configuration
; This file configures the build environment for the ESP32 shell port.
;
; Build options: build flags, source filter, etc.
; Upload options: custom upload port, speed, etc.
; Library options: dependencies, extra library storage, etc.
;
; For more info see: https://docs.platformio.org/page/projectconf.html

[env:esp32s3dev]
; ============================================================================
; Platform and Board Configuration
; ============================================================================
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; ============================================================================
; Build Configuration
; ============================================================================
; Define ESP_PLATFORM macro so our code knows we're building for ESP32
build_flags = 
    -DESP_PLATFORM=1
    -DCONFIG_ESP32_SHELL=1
    -Wall
    -Wextra

; ============================================================================
; Serial Monitor Configuration
; ============================================================================
monitor_speed = 115200
monitor_filters = 
    direct
    esp32_exception_decoder

; ============================================================================
; Partition Table Configuration
; ============================================================================
; Use custom partition table with SPIFFS for filesystem storage
board_build.partitions = partitions.csv

; ============================================================================
; Component/Library Configuration  
; ============================================================================
; Extra source directories to include in the build
; The shell source files will be in src/ and components/

; ============================================================================
; Upload Configuration
; ============================================================================
; upload_port = /dev/ttyUSB0
; upload_speed = 921600

; ============================================================================
; Debugging Configuration (optional)
; ============================================================================
; debug_tool = esp-prog
; debug_init_break = tbreak app_main
